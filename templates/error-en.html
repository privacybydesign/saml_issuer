<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<link href="/css/style.css" rel="stylesheet" type="text/css" />
	<title>{{.ProviderName}} login failed</title>
</head>
<body>
	<div id="container">
		<header>
			<div class="header-spacer"></div>
			<h1>Login with {{.ProviderName}} failed</h1>
			{{template "langswitch" .}}
		</header>
		<main>
			<div class="content">
				<div class="alert alert-danger" role="alert">
					<strong>Error</strong>: {{.Message}}
				</div>
			</div>
		</main>
		<footer>
			<div class="actions">
				<div></div>
				<a href="{{.RetryURL}}" class="primary">Try again</a>
			</div>
		</footer>
	</div>
</body>
</html>
